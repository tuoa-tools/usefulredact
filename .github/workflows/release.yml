name: Release

# A tag like v0.1.2 builds everything below and publishes it on the releases page. Running
# this by hand ("Run workflow") builds and tests it all the same way and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04 # older glibc = runs on more distros
            name: linux-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-latest # Apple Silicon
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install the app and the build tools
        run: pip install -e ".[build]" -c constraints.txt

      - name: Gather the models and check the UI
        run: python scripts/prepare_bundle.py

      # Windows: no PyInstaller - Defender quarantines its exes. Embeddable Python + Inno Setup.
      - name: Assemble the Windows app folder
        if: runner.os == 'Windows'
        run: python scripts/build_windows.py

      - name: Smoke-test the Windows layout
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py build/windows/python/python.exe -m app.launcher

      - name: The windowed runtime starts too (what the shortcut runs; it has no console)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USEFULREDACT_TOKEN = "windowed-smoke"
          $app = Start-Process -FilePath build\windows\python\pythonw.exe -ArgumentList "-m","app.launcher","--no-browser","--port","8790" -PassThru
          $ok = $false
          foreach ($i in 1..120) {
            Start-Sleep -Milliseconds 500
            try { Invoke-RestMethod http://127.0.0.1:8790/api/health | Out-Null; $ok = $true; break } catch {}
          }
          if (-not $ok) { Write-Error "pythonw.exe did not serve"; exit 1 }
          Invoke-RestMethod -Method Post -Headers @{ "x-usefulredact-token" = "windowed-smoke" } http://127.0.0.1:8790/api/quit | Out-Null
          $app.WaitForExit(30000) | Out-Null
          if (-not $app.HasExited) { Write-Error "pythonw.exe did not exit after Quit"; exit 1 }

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:APP_VERSION = "${{ github.ref_name }}".TrimStart("v")
          if (-not $env:APP_VERSION -or $env:APP_VERSION -eq "main") { $env:APP_VERSION = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows.iss

      - name: Bundle with PyInstaller
        if: runner.os != 'Windows'
        run: pyinstaller --noconfirm --clean --log-level WARN packaging/UsefulRedact.spec

      - name: Smoke-test the bundle (macOS)
        if: runner.os == 'macOS'
        run: python scripts/smoke_bundle.py dist/UsefulRedact.app/Contents/MacOS/UsefulRedact

      - name: Smoke-test the bundle (Linux)
        if: runner.os == 'Linux'
        run: python scripts/smoke_bundle.py dist/UsefulRedact/UsefulRedact

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/UsefulRedact.app UsefulRedact-${{ matrix.name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf UsefulRedact-${{ matrix.name }}.tar.gz UsefulRedact

      - uses: actions/upload-artifact@v7
        with:
          name: UsefulRedact-${{ matrix.name }}
          path: UsefulRedact-*.*
          if-no-files-found: error

  # For people who have Python: the app as a wheel, with the UI inside it.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI into app/static
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel
        run: pip install build && python -m build --wheel
      - name: The wheel must carry the UI, and its version must be the tag's
        run: |
          python - <<'PY'
          import glob, os, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "app/static/index.html" in names, "the UI is not in the wheel"
          assert any(n.startswith("app/static/assets/") and n.endswith(".js") for n in names)
          stray = [n for n in names if n.split("/")[0] in ("tests", "corpus", "frontend", "eval", "scripts")]
          assert not stray, stray
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              version = ref.removeprefix("refs/tags/v")
              assert f"-{version}-" in wheel, f"tag {version} but wheel {wheel}"
          print(wheel, len(names), "files")
          PY
      - name: Install it somewhere clean and run it, with no Node and no clone
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl -c constraints.txt
          cp scripts/smoke_bundle.py /tmp/ && cd /tmp
          /tmp/clean/bin/python smoke_bundle.py /tmp/clean/bin/usefulredact-app
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: UsefulRedact ${{ github.ref_name }}
          files: |
            artifacts/UsefulRedact-*
            artifacts/usefulredact-*.whl
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
