name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # macos-latest is Apple Silicon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # The tests generate their own fixtures and read them with the OCR and NER models
      # that came with the install; nothing is fetched while they run.
      - run: pytest -q
